<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À Propos - Noémie Sanner</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f4f7f6;
            text-align: center;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }

        .download-box {
            background: #f9f9f9;
            border: 2px dashed #3498db;
            padding: 30px;
            border-radius: 10px;
        }

        .btn-download {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s;
        }

        .btn-download:hover {
            background: #2980b9;
        }

        .file-info {
            display: block;
            margin-top: 10px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Retour à l'accueil</a>

    <div class="container">
        <h1>Mon Curriculum Vitae</h1>
        <p>Vous pouvez consulter ou télécharger mon CV complet au format PDF ci-dessous pour plus de détails sur mon parcours SISR.</p>

        <div class="download-box">
            <a href="CV_Noemie_Sanner.pdf" class="btn-download" download>
                📥 Télécharger mon CV (PDF)
            </a>
            <span class="file-info">Format PDF - 2026</span>
        </div>
    </div>

</body>
</html>
